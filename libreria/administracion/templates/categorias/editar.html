<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Editar categoría</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FCE6D1] text-[#4b4b4b]">
  {% include 'nav.html' %}
  <main class="mx-auto max-w-3xl p-6">
    <section class="bg-white/85 ring-1 ring-[#EAC1BB] rounded-2xl p-6 shadow-sm mt-8">
      <div class="flex items-center justify-between mb-4">
        <h1 class="text-2xl font-semibold text-[#775c59]">Editar categoría</h1>
        <a href="{% url 'categoria_list' %}" class="text-sm underline text-[#775c59]">Volver al listado</a>
      </div>

      <form method="post" class="space-y-6">
        {% csrf_token %}
        {% if errors.nombre %}<p class="text-sm text-red-600">{{ errors.nombre }}</p>{% endif %}
        <div>
          <label class="block mb-2 text-[#775c59]">Nombre</label>
          <input type="text" name="nombre" maxlength="80" value="{{ cat.nombre }}"
                 class="w-full border-2 border-[#EAC1BB] rounded-xl px-4 py-2">
        </div>
        <div class="flex items-center justify-end gap-3">
          <a href="{% url 'categoria_list' %}" class="px-4 py-2 rounded-lg border border-[#EAC1BB]">Cancelar</a>
          <button class="px-4 py-2 rounded-lg border border-[#9bb19b] bg-[#C5D7C0]">Guardar cambios</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
